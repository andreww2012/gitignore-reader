name: Prepare
description: Prepares CI environment

inputs:
  node-version:
    description: Node.js version to use
    required: false
    default: '22'

runs:
  using: composite
  steps:
    - name: Read pnpm version from package.json
      id: pnpm-version
      shell: bash
      run: echo "version=$(jq -r '.devEngines.packageManager.version' package.json)" >> "$GITHUB_OUTPUT"
    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        # TODO remove the explicit version after
        # https://github.com/pnpm/action-setup/issues/227 is fixed
        version: ${{ steps.pnpm-version.outputs.version }}
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        cache: pnpm
        node-version: ${{ inputs.node-version }}
        registry-url: https://registry.npmjs.org # Required for Trusted Publishing
    - name: Install dependencies
      shell: bash
      run: pnpm ci
    - name: Check deps for vulnerabilities & peer deps issues
      shell: bash
      run: pnpm check:deps
